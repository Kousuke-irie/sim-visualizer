services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ${DATA_DIR:-./data}:/data:ro
    environment:
      # ディレクトリモードで開けるのはマウントした /data 配下のみ（DESIGN_directory_mode.md 2.1）
      SIMVIZ_DATA_ROOTS: /data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on: [backend]
